name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[cpu,dev]"

      - name: Check private artifacts
        shell: pwsh
        run: .\scripts\check-release.ps1

      - name: Lint
        run: python -m ruff check src tests tools

      - name: Compile
        run: python -m compileall -q src

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  packaging:
    name: Package metadata and contents
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # Inspect the archives directly: this job must not need PySide6 or ONNX Runtime.
      - name: Verify the wheel declares MIT and ships the brand assets
        shell: pwsh
        run: .\scripts\check-package.ps1
